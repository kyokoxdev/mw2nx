# ============================================================================
#  MW2 multiplayer (TU6 default_mp.xex) - manual declarations for the codegen
#
#  Starting point: addresses from PaulCombal/mw2-recompiled config/MW2MP.toml
#  (XenonRecomp config, same TU6 image). Re-verify each against the dumped
#  image (tools/inspect/ppc_dis.py) once work/dump_tu6 exists.
# ============================================================================

# --- setjmp / longjmp (root keys: must stay ABOVE [functions]) ---------------
# Com_Error longjmps back to the frame loop's setjmp (same scheme as BO2).
setjmp_address = 0x8241C710
longjmp_address = 0x8241D470

# Register locals, as in app/overrides.toml. mw2-recompiled runs the same set
# (plus non_argument_as_local, left off here for the reason bo2 gives: r12 is
# __savevmx_N's base).
cr_as_local = true
xer_as_local = true
ctr_as_local = true
non_volatile_as_local = true
# Scratch vector registers (v0, v32-v63) as locals, as BO2 (app/overrides.toml: +1.7 %). Not an argument or a return
# value; tools/read_before_write.py --strict checks no function reads one before writing it.
vector_scratch_as_local = true

# --- mfmsr / mtmsrd: no global lock (root key), as bo2's app/overrides.toml ---
# 330 sites wrap lwarx/stwcx. atomics in "mfmsr rX; mtmsrd r13,1 ... mtmsrd rX,1".
# The codegen's default turns them into REX_ENTER/LEAVE/CHECK_GLOBAL_LOCK, one
# recursive mutex for every thread: run 028 (mp_rust, mp_terminal) had the game
# threads (Main, Worker0-2, Backend, Server) 60-84% of their samples blocked in
# mutexLock on it. Every region is a pure CAS loop (no other stores or calls
# inside, checked over generated/), and on the 360 interrupts off never excluded
# the other cores, so mfmsr/mtmsrd become no-ops.
skip_msr = true

[functions]

# --- Compact branch ladders the analyzer splits (mw2-recompiled) -------------
"0x821486B8" = { size = 0x44 }
"0x8210F468" = { size = 0x9C }

# --- Leaf functions with jump tables, absent from .pdata (mw2-recompiled
#     tools/fixbounds.py: bl targets, padding runs, case labels) -------------
"0x820CC0F8" = { size = 0xA8 }
"0x82115AA8" = { size = 0x60 }
"0x82115B08" = { size = 0x70 }
"0x82157640" = { size = 0x9C }
"0x821AABB0" = { size = 0x118 }
"0x821AACF0" = { size = 0x114 }
"0x821AAE90" = { size = 0x3B8 }
"0x82291288" = { size = 0x64 }
"0x822DD760" = { size = 0xD4 }
"0x822EB578" = { size = 0x88 }
"0x822F3700" = { size = 0xE0 }
"0x822F4D30" = { size = 0x94 }
"0x82300E58" = { size = 0xD0 }
"0x823011D8" = { size = 0x64 }
"0x82301240" = { size = 0x74 }
"0x823012C0" = { size = 0x60 }
"0x82301320" = { size = 0x78 }
"0x82301398" = { size = 0x68 }
"0x8230C9D8" = { size = 0x20C }
"0x8230CBE8" = { size = 0x1E0 }
"0x8230FFB8" = { size = 0x1B0 }
"0x823FEA58" = { size = 0x14C }

# --- Standalone functions the analyzer never claimed -------------------------
# Follows the thunk `addi r3,r3,0x6C; b 0x82367760` (ends 0x82368AE4); reached only by the tail branch in the
# bdz jump ladder at 0x8236CE24.
"0x82368AE8" = { }   # lis r8,0x8200; lwz r11,0x40(r3); lfs f13,0x44(r3) ...     <- 0x8236CE24

# --- Native C library functions ([rexcrt]) -----------------------------------
# As app/overrides.toml: the codegen drops each function listed here and calls rexcrt_<key> (mw2mp/src/mw2mp_crt.cpp)
# from direct calls and the dispatch table alike. Same XDK CRT as BO2's; evidence from the generated code's
# disassembly comments (mw2mp/generated/default_mp), call sites counted there.
[rexcrt]
#  0x8241A9F0 memcpy, CRT (576 call sites). r3 dst, r4 src, r5 n. std r3,-8(r1); clrlwi r6,r3,29; dcbt r0,r4; byte,
#    word, doubleword and 128-byte ld/std loops, forwards only; every exit is ld r3,-8(r1); blr (returns dst).
mw2mp_memcpy = 0x8241A9F0
#  0x8241A890 memset, CRT (470 call sites). r3 dst, r4 value, r5 n. The cursor is r6 (ori r6,r3,0), r3 is never
#    written; the low byte is replicated with rlwimi r4,r4,8,16,23 before the word loops.
mw2mp_memset = 0x8241A890
